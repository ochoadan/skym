name: Verify service and adapter logic
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build and test real local processes
        shell: pwsh
        run: dotnet run --project tests/Community.Tests --configuration Release
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          architecture: x64
      - name: Verify adapter guards and interaction logic without game files
        shell: pwsh
        run: python -m unittest discover -s tests/Community.AdapterLab.Tests -v
